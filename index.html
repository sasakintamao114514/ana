<style>

 for(let i=0;i<7000;i++){const c=rn(),s=1+rn()*4;x.fillStyle=c<.35?'rgba(30,18,9,.55)':c<.7?'rgba(180,130,85,.45)':'rgba(120,78,45,.5)';x.fillRect(rn()*w,rn()*h,s,s)}
 for(let i=0;i<260;i++){const X=rn()*w,Y=rn()*h,r=3+rn()*9,g=x.createRadialGradient(X-r*.3,Y-r*.3,0,X,Y,r);g.addColorStop(0,'rgba(170,120,80,.8)');g.addColorStop(1,'rgba(40,24,12,.7)');x.fillStyle=g;x.beginPath();x.ellipse(X,Y,r,r*.8,rn()*3,0,7);x.fill()}

},512,512);

function mkNoise(n){const g=new Float32Array(n*n);for(let i=0;i<g.length;i++)g[i]=rn();return g}
function vn(g,n,x,y){const xi=Math.floor(x),yi=Math.floor(y),fx=x-xi,fy=y-yi,u=fx*fx*(3-2*fx),v=fy*fy*(3-2*fy),m=n-1,X0=xi&m,X1=(xi+1)&m,Y0=yi&m,Y1=(yi+1)&m,a=g[Y0*n+X0],b=g[Y0*n+X1],c=g[Y1*n+X0],d=g[Y1*n+X1];return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}

  for(let b=-1;b<=1;b++)for(let a=-1;a<=1;a++){const k=(i0+a+1)+(j0+b+1)*(G+2),p=pts[k];if(!p)continue;const dx=u-p[0],dy=v-p[1],d=Math.sqrt(dx*dx+dy*dy);if(d<d1){d2=d1;d1=d;id=k}else if(d<d2)d2=d}

 const oct=[[8,.45],[16,.27],[32,.15],[64,.09],[128,.05]].map(o=>({n:o[0],wt:o[1],g:mkNoise(o[0])})),cn=mkNoise(6),G=22,pts=[];

 const H=new Float32Array(w*w),PT=new Float32Array(w*w),PL=new Float32Array(w*w);
 for(let y=0;y<w;y++)for(let x=0;x<w;x++){let f=0;for(let k=0;k<5;k++){const o=oct[k];f+=vn(o.g,o.n,x/w*o.n,y/w*o.n)*o.wt}
  const u=x/w*G,v=y/w*G,i0=Math.floor(u),j0=Math.floor(v);let d1=9;

 if(aim!=='pick'&&aim!=='tile'&&aim!=='pile'&&aim!=='toilet'){let bd2=1e9;ITEMS.forEach(it=>{if(it.st==='found'||it.st==='table'){const ih=ray.intersectObject(it.hit);if(ih.length&&ih[0].distance<2.6&&ih[0].distance<bd2){bd2=ih[0].distance;itemTarget=it}}});
  if(itemTarget&&(!hit.length||bd2<=hit[0].distance+.15)){aim='item';target=null}else itemTarget=null}
 if(haveSpoon&&(aim===''||aim==='dig'||aim==='blocked')){const bh=ray.intersectObject(bedHit);if(bh.length&&bh[0].distance<2.6&&(!hit.length||bh[0].distance<=hit[0].distance)){aim='bed';target=null}}
 if(haveSpoon&&toolKind==='spoon'&&aim!=='pile'&&aim!=='toilet'&&aim!=='item'&&aim!=='bed'){const cu=ray.intersectObject(cupHit);if(cu.length&&cu[0].distance<2.4&&(!hit.length||cu[0].distance<=hit[0].distance)){aim='back';target=null}}
 if(haveSpoon&&toolKind==='shovel'&&(aim===''||aim==='blocked')){const sw=ray.intersectObject(rackHit);if(sw.length&&sw[0].distance<2.6){aim='backshovel';target=null}}
 if(aim===''&&!shovelOwned){const pj=ray.intersectObject(prisHit);if(pj.length&&pj[0].distance<4.5)aim='trade'}
 if(haveChair&&aim!=='tile'&&aim!=='pick'){const cs=ray.intersectObject(chairHit);if(cs.length&&cs[0].distance<2.6){aim='backchair';tileTarget=null}}
 if(gState==='waiting'){const gh=ray.intersectObject(guardHit);if(gh.length&&gh[0].distance<3.4&&(aim===''||aim==='blocked'||aim==='dig')){aim='give';target=null}}
 if(aim===''){const bh2=ray.intersectObject(barsHit);if(bh2.length&&bh2[0].distance<2.6)aim='bars'}
 if(aim===''&&ITEMS.some(i=>i.st==='bag')){const tb2=ray.intersectObject(tableHit);if(tb2.length&&tb2[0].distance<2.8)aim='put'}
 if(aim===''||aim==='blocked'){const rh=ray.intersectObject(covered?rugHit:rollHit);if(rh.length&&rh[0].distance<2.8)aim='rug'}
 hl.visible=false;
 const near=Math.abs(px)<2.4&&pz>-1.8&&pz<3.2,none=!haveSpoon&&!haveChair;
 msg.textContent=hintText();uiAim();
 if(toastT>0&&toastSp){msg.textContent='';if(dlgCur!==toastTxt){dlgCur=toastTxt;dN.textContent=toastSp.n;dT.textContent=toastSp.t;dX.textContent=toastSp.x}$('dlg').style.display='block'}else{if(toastT>0)msg.textContent=toastTxt;$('dlg').style.display='none';dlgCur=''}
 lbl.textContent=doorOpen?'独房の扉が開いている（あと'+Math.max(0,Math.ceil(retT))+'秒）':!did.rugOff?'カーペットをどけよう':!did.pickC?'イスを取ろう':!did.tiles?'タイルを壊そう':'床を掘って脱出しよう';
 {const bl=aim==='rug'?(covered?'どける':'戻す'):aim==='give'?'渡す':aim==='bars'?'叩く':aim==='put'?'置く':aim==='trade'?'渡す':aim==='back'||aim==='backchair'||aim==='backshovel'?'戻す':aim==='bed'?'隠す':aim==='item'?(itemTarget.st==='table'?'取る':'拾う'):aim==='pick'?'取る':aim==='tile'?'壊す':aim==='pile'?'すくう':aim==='toilet'?'流す':none?'取る':haveChair?'壊す':'掘る';if(bl!==lastBl){$('bd').textContent=bl;lastBl=bl}}
}
function loop(n){const dt=Math.min((n-last)/1000,.1);last=n;step(dt);tickParts(dt);rugAnim(dt);tickWater(dt);tickPris(n/1000);tickGuard(dt);tickGlow(n/1000);tickGhost(n/1000);tickMark(n/1000);drawFrame();requestAnimationFrame(loop)}
// 入力（タッチ専用）
const jb=$('jb'),jk=$('jk'),JR=55;let jx=0,jy=0,lx=0,ly=0;
wrap.addEventListener('pointerdown',e=>{
 if(state!=='play'||e.target.closest('button'))return;
 if(e.clientX<innerWidth*.45&&jid===null){jid=e.pointerId;jx=e.clientX;jy=e.clientY;jb.style.cssText='display:block;left:'+jx+'px;top:'+jy+'px';jk.style.transform='translate(0,0)'}
 else if(lid===null){lid=e.pointerId;lx=e.clientX;ly=e.clientY}});
wrap.addEventListener('pointermove',e=>{
 if(e.pointerId===jid){let dx=e.clientX-jx,dy=e.clientY-jy;const d=Math.hypot(dx,dy);if(d>JR){dx*=JR/d;dy*=JR/d}mv.x=dx/JR;mv.y=dy/JR;jk.style.transform='translate('+dx+'px,'+dy+'px)'}
 else if(e.pointerId===lid){yaw-=(e.clientX-lx)*.005;pitch=Math.max(-1.3,Math.min(1.3,pitch-(e.clientY-ly)*.005));lx=e.clientX;ly=e.clientY}});
function up(e){if(e.pointerId===jid){jid=null;mv.x=mv.y=0;jb.style.display='none'}if(e.pointerId===lid)lid=null}
addEventListener('pointerup',up);addEventListener('pointercancel',up);
const bd=$('bd');
bd.addEventListener('pointerdown',e=>{e.preventDefault();digHold=1;act()});
['pointerup','pointerleave','pointercancel'].forEach(ev=>bd.addEventListener(ev,()=>{digHold=0}));

addEventListener('contextmenu',e=>e.preventDefault());
ov.addEventListener('pointerdown',e=>{e.stopPropagation();if(state!=='play'){init();try{const el=document.documentElement,p=el.requestFullscreen&&el.requestFullscreen();if(p&&p.catch)p.catch(()=>{})}catch(_){}}});
ov.innerHTML='<b>穴を掘って刑務所脱獄</b><span>最初は何も持っていない。<br>カーペットをどけて、机のそばのイスでタイルを壊し、洗面台横のコップのスプーンで土を掘って脱出しよう。</span><span>画面の左側ドラッグ：移動　右側ドラッグ：見回し<br>「掘る」を押している間、土が少しずつ削れる</span><span>横向きでプレイ推奨・タップで開始</span>';
requestAnimationFrame(loop);
